<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#020202">

<title>LTF Miner</title>

<style>
:root{
  --bg:#020202;
  --panel:#090909;
  --gold:#f5c84c;
  --gold2:#ffe58a;
  --gold3:#b98216;
  --text:#fff;
  --muted:#8d8d8d;
  --line:rgba(245,200,76,.20);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#020202;
  color:#fff;
  font-family:
    Arial,
    Tahoma,
    sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button{
  font-family:inherit;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:
    max(14px,env(safe-area-inset-top))
    14px
    max(22px,env(safe-area-inset-bottom));
  position:relative;
  overflow:hidden;
}

/* =========================
   HEADER
========================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
}

.brand-coin{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;

  color:#090909;
  font-size:15px;
  font-weight:900;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff4bd 0%,
      #ffd965 20%,
      #e5aa28 48%,
      #8d5c0b 100%
    );

  border:1px solid rgba(255,235,150,.7);

  box-shadow:
    0 0 12px rgba(245,200,76,.28),
    inset 0 1px 2px rgba(255,255,255,.7);
}

.brand-text{
  display:flex;
  flex-direction:column;
  line-height:1;
}

.brand-main{
  font-size:17px;
  font-weight:900;
  letter-spacing:2px;
}

.brand-sub{
  margin-top:4px;
  font-size:9px;
  color:#858585;
  letter-spacing:2px;
}

.balance{
  min-width:92px;
  padding:8px 11px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;

  border:1px solid var(--line);
  border-radius:14px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.01)
    );

  box-shadow:
    inset 0 0 15px rgba(245,200,76,.025);
}

.balance-number{
  color:var(--gold2);
  font-size:13px;
  font-weight:800;
}

.balance-unit{
  color:#858585;
  font-size:10px;
  font-weight:700;
}

/* =========================
   HERO
========================= */

.hero{
  position:relative;
  height:355px;
  margin-top:2px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.orbit{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(245,200,76,.22);
  border-radius:50%;
  pointer-events:none;
}

.orbit.one{
  width:235px;
  height:235px;
  transform:
    translate(-50%,-50%)
    rotate(-18deg);
}

.orbit.two{
  width:285px;
  height:145px;
  transform:
    translate(-50%,-50%)
    rotate(25deg);
}

.orbit.three{
  width:320px;
  height:190px;
  transform:
    translate(-50%,-50%)
    rotate(-35deg);
}

.orbit::after{
  content:"";
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 9px var(--gold);
}

.orbit.one::after{
  right:18%;
  top:8%;
}

.orbit.two::after{
  left:12%;
  top:22%;
}

.orbit.three::after{
  right:12%;
  bottom:13%;
}

/* =========================
   COIN
========================= */

.coin-wrap{
  position:relative;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:center;
}

.coin{
  width:145px;
  height:145px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  background:
    radial-gradient(
      circle at 35% 28%,
      #fff6c9 0%,
      #ffe17a 14%,
      #f1bc3d 38%,
      #c88a18 64%,
      #70450b 100%
    );

  border:4px solid #d9a62e;

  box-shadow:
    0 0 0 7px rgba(245,200,76,.05),
    0 0 28px rgba(245,200,76,.28),
    inset 0 3px 5px rgba(255,255,255,.7),
    inset 0 -8px 14px rgba(65,35,0,.28);
}

.coin::before{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:50%;
  border:1px solid rgba(255,246,194,.48);
}

.coin::after{
  content:"";
  position:absolute;
  width:78px;
  height:18px;
  left:30px;
  top:16px;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  filter:blur(7px);
  transform:rotate(-18deg);
}

.coin-logo{
  position:relative;
  z-index:2;
  color:#4a2b00;
  font-size:42px;
  font-weight:1000;
  letter-spacing:-3px;
  text-shadow:
    0 1px 0 rgba(255,244,180,.65);
}

/* =========================
   PLATFORM
========================= */

.platform{
  position:absolute;
  z-index:2;
  bottom:42px;
  width:185px;
  height:26px;
  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(245,200,76,.26),
      rgba(245,200,76,.04) 58%,
      transparent 72%
    );

  border-bottom:1px solid rgba(245,200,76,.32);

  filter:blur(.2px);
}

/* =========================
   TIMER AREA
========================= */

.timer-card{
  position:relative;

  width:100%;
  padding:15px 14px 13px;

  border:1px solid var(--line);
  border-radius:18px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.012)
    );

  box-shadow:
    inset 0 0 22px rgba(245,200,76,.025);
}

.timer-title{
  text-align:center;
  color:#777;
  font-size:10px;
  letter-spacing:1.5px;
  margin-bottom:8px;
}

.timer-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
}

/* =========================
   CLOCK
   CSS ONLY
========================= */

.clock{
  width:29px;
  height:29px;
  min-width:29px;

  position:relative;

  border:1.5px solid #e8b93f;
  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      rgba(255,230,130,.12),
      rgba(0,0,0,.05)
    );

  box-shadow:
    0 0 8px rgba(245,200,76,.14),
    inset 0 0 5px rgba(245,200,76,.08);
}

/* نقاط صغيرة 12 - 3 - 6 - 9 */
.clock::before{
  content:"";
  position:absolute;
  left:50%;
  top:2px;

  width:2px;
  height:3px;

  transform:translateX(-50%);

  border-radius:2px;
  background:#efc34b;

  box-shadow:
    0 20px 0 #efc34b;
}

.clock::after{
  content:"";
  position:absolute;
  left:2px;
  top:50%;

  width:3px;
  height:2px;

  transform:translateY(-50%);

  border-radius:2px;
  background:#efc34b;

  box-shadow:
    20px 0 0 #efc34b;
}

/* العقارب */
.clock-hand{
  position:absolute;
  left:50%;
  bottom:50%;

  transform-origin:50% 100%;

  border-radius:5px;

  background:#f7d365;

  z-index:3;
}

/* عقرب الساعة أقصر */
.clock-hand.hour{
  width:2px;
  height:7px;
  transform:
    translateX(-50%)
    rotate(35deg);
}

/* عقرب الدقائق أطول */
.clock-hand.minute{
  width:1.5px;
  height:10px;
  transform:
    translateX(-50%)
    rotate(125deg);
}

/* نقطة الوسط */
.clock-dot{
  position:absolute;
  left:50%;
  top:50%;

  width:4px;
  height:4px;

  transform:translate(-50%,-50%);

  border-radius:50%;
  background:#ffe58a;

  box-shadow:
    0 0 5px rgba(245,200,76,.45);

  z-index:5;
}

.mined-number{
  min-width:120px;
  text-align:center;

  color:#fff3b7;
  font-size:24px;
  font-weight:900;
  letter-spacing:.5px;
}

.mined-unit{
  color:#a78330;
  font-size:11px;
  font-weight:800;
}

.timer-sub{
  text-align:center;
  color:#666;
  font-size:9px;
  margin-top:7px;
}

/* =========================
   CLAIM
========================= */

.claim-wrap{
  margin-top:13px;
}

.claim-btn{
  width:100%;
  height:57px;

  border:1px solid rgba(255,219,105,.55);
  border-radius:17px;

  color:#171000;

  font-size:16px;
  font-weight:1000;
  letter-spacing:2px;

  background:
    linear-gradient(
      180deg,
      #ffe68b 0%,
      #f6c84e 48%,
      #c98c18 100%
    );

  box-shadow:
    0 8px 24px rgba(245,200,76,.16),
    inset 0 1px 2px rgba(255,255,255,.75);

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  cursor:pointer;

  transition:
    transform .15s ease,
    opacity .15s ease,
    filter .15s ease;
}

.claim-btn:active{
  transform:scale(.985);
}

.claim-btn.disabled{
  opacity:.42;
  filter:grayscale(.25);
  cursor:not-allowed;
}

.claim-icon{
  font-size:18px;
  line-height:1;
}

/* =========================
   BOTTOM CARDS
========================= */

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:12px;
}

.action{
  min-height:66px;

  border:1px solid rgba(245,200,76,.15);
  border-radius:15px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.03),
      rgba(255,255,255,.01)
    );

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;

  color:#999;
}

.action-icon{
  color:#dcae37;
  font-size:18px;
}

.action-title{
  font-size:9px;
  letter-spacing:.5px;
}

.action-value{
  font-size:8px;
  color:#555;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:360px){

  .hero{
    height:325px;
  }

  .coin{
    width:132px;
    height:132px;
  }

  .coin-logo{
    font-size:38px;
  }

  .orbit.one{
    width:215px;
    height:215px;
  }

  .orbit.two{
    width:260px;
    height:135px;
  }

  .orbit.three{
    width:290px;
    height:175px;
  }

  .clock{
    width:27px;
    height:27px;
    min-width:27px;
  }

  .mined-number{
    font-size:21px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <div class="brand">

      <div class="brand-coin">
        L
      </div>

      <div class="brand-text">
        <div class="brand-main">LTF</div>
        <div class="brand-sub">MINER</div>
      </div>

    </div>

    <div class="balance">
      <span id="balanceValue"
            class="balance-number">
        0.000000
      </span>

      <span class="balance-unit">
        LTF
      </span>
    </div>

  </header>


  <!-- HERO -->
  <section class="hero">

    <div class="orbit one"></div>
    <div class="orbit two"></div>
    <div class="orbit three"></div>

    <div class="coin-wrap">

      <div class="coin">
        <div class="coin-logo">LTF</div>
      </div>

    </div>

    <div class="platform"></div>

  </section>


  <!-- TIMER -->
  <section class="timer-card">

    <div class="timer-title">
      MINING
    </div>

    <div class="timer-row">

      <!-- ساعة CSS -->
      <div class="clock"
           aria-hidden="true">

        <span class="clock-hand hour"></span>

        <span class="clock-hand minute"></span>

        <span class="clock-dot"></span>

      </div>

      <div id="minedValue"
           class="mined-number">
        0.000000
      </div>

      <div class="mined-unit">
        LTF
      </div>

    </div>

    <div id="timerText"
         class="timer-sub">
      التعدين مستمر
    </div>

  </section>


  <!-- CLAIM -->
  <div class="claim-wrap">

    <button id="claimBtn"
            class="claim-btn disabled"
            type="button"
            disabled>

      <span class="claim-icon">◈</span>

      <span>CLAIM</span>

      <span class="claim-icon">›</span>

    </button>

  </div>


  <!-- ACTIONS -->
  <section class="actions">

    <div class="action">

      <div class="action-icon">⇄</div>

      <div class="action-title">
        SWAP
      </div>

      <div class="action-value">
        SOON
      </div>

    </div>

    <div class="action">

      <div class="action-icon">✓</div>

      <div class="action-title">
        TASKS
      </div>

      <div class="action-value">
        SOON
      </div>

    </div>

    <div class="action">

      <div class="action-icon">⚡</div>

      <div class="action-title">
        POWER
      </div>

      <div class="action-value">
        ACTIVE
      </div>

    </div>

  </section>

</div>


<script>
/* =========================================
   LTF MINER
   3 LTF كل 3 ساعات
========================================= */

const MINING_DURATION =
  3 * 60 * 60 * 1000;

const MINING_REWARD = 3;

const BALANCE_KEY =
  "ltf_balance_v13";

const START_KEY =
  "ltf_mining_start_v13";


const balanceEl =
  document.getElementById("balanceValue");

const minedEl =
  document.getElementById("minedValue");

const timerTextEl =
  document.getElementById("timerText");

const claimBtn =
  document.getElementById("claimBtn");


/* =========================
   SAFE NUMBER
========================= */

function getBalance(){

  const value =
    parseFloat(
      localStorage.getItem(BALANCE_KEY)
    );

  return Number.isFinite(value)
    ? value
    : 0;
}


function setBalance(value){

  localStorage.setItem(
    BALANCE_KEY,
    value.toFixed(6)
  );

}


/* =========================
   MINING START
========================= */

function getMiningStart(){

  let start =
    parseInt(
      localStorage.getItem(START_KEY),
      10
    );

  if(!Number.isFinite(start)){

    start = Date.now();

    localStorage.setItem(
      START_KEY,
      String(start)
    );

  }

  return start;
}


/* =========================
   FORMAT
========================= */

function formatLTF(value){

  return Number(value)
    .toFixed(6);
}


/* =========================
   RENDER
========================= */

function render(){

  const balance =
    getBalance();

  const start =
    getMiningStart();

  const now =
    Date.now();

  let elapsed =
    now - start;

  if(elapsed < 0){
    elapsed = 0;
  }

  if(elapsed >= MINING_DURATION){

    minedEl.textContent =
      formatLTF(MINING_REWARD);

    timerTextEl.textContent =
      "التعدين مكتمل — اضغط CLAIM";

    claimBtn.disabled = false;

    claimBtn.classList.remove(
      "disabled"
    );

  }else{

    const progress =
      elapsed / MINING_DURATION;

    const mined =
      MINING_REWARD * progress;

    minedEl.textContent =
      formatLTF(mined);

    const remaining =
      MINING_DURATION - elapsed;

    timerTextEl.textContent =
      "متبقي " +
      formatTime(remaining);

    claimBtn.disabled = true;

    claimBtn.classList.add(
      "disabled"
    );

  }

  balanceEl.textContent =
    formatLTF(balance);

}


/* =========================
   TIME
========================= */

function formatTime(ms){

  const totalSeconds =
    Math.max(
      0,
      Math.floor(ms / 1000)
    );

  const hours =
    Math.floor(
      totalSeconds / 3600
    );

  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );

  const seconds =
    totalSeconds % 60;

  return (
    String(hours).padStart(2,"0")
    + ":" +
    String(minutes).padStart(2,"0")
    + ":" +
    String(seconds).padStart(2,"0")
  );

}


/* =========================
   CLAIM
========================= */

claimBtn.addEventListener(
  "click",
  function(){

    if(claimBtn.disabled){
      return;
    }

    const currentBalance =
      getBalance();

    const newBalance =
      currentBalance +
      MINING_REWARD;

    setBalance(newBalance);

    localStorage.setItem(
      START_KEY,
      String(Date.now())
    );

    render();

  }
);


/* =========================
   START
========================= */

render();

setInterval(
  render,
  1000
);

</script>

</body>
</html>
