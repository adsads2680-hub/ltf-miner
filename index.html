function openTasks(){tasksOverlay.classList.add("show");document.body.style.overflow="hidden";loadTasks()}function closeTasks(){tasksOverlay.classList.remove("show");document.body.style.overflow=""}

async function claimTask(code){if(!telegramUser)return showMessage(T.mustTelegram);try{const{data,error}=await supabaseClient.rpc("claim_ltf_task",{p_telegram_user_id:Number(telegramUser.id),p_task_code:code});if(error)throw error;const r=Array.isArray(data)?data[0]:data;if(r&&r.success===true){setBalance(r.new_balance);if(code==="telegram_join")taskState.telegram_joined=true;if(code==="youtube_join")taskState.youtube_joined=true;if(code==="login_2h")taskState.login_next_available_at=r.next_available_at||null;updateTaskButtons();startTaskTimer();showMessage(T.taskSuccess);if(tg?.HapticFeedback)tg.HapticFeedback.notificationOccurred("success")}else showMessage(r?.message||T.taskFail)}catch(e){showMessage(T.taskError+"\n\n"+e.message)}}
telegramTaskBtn.onclick=()=>{window.open("https://t.me/LTFMiner","_blank");setTimeout(()=>claimTask("telegram_join"),500)}
youtubeTaskBtn.onclick=()=>{window.open("https://youtube.com/@ltfminer","_blank");setTimeout(()=>claimTask("youtube_join"),500)}
loginTaskBtn.onclick=()=>{if(loginTaskBtn.disabled)return;claimTask("login_2h")};
async function init(){telegramUser=getTelegramUser();startMiningTicker();if(!telegramUser){claimBtn.disabled=true;statusEl.textContent=T.notTelegram;return}updateUserUI();await loadStatus();await loadTasks()}
init();
</script>
</body></html>
