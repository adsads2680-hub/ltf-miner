<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020711">
<title>LTF Miner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#020711;--panel:#041226;--blue:#08aaff;--blue2:#006dff;--text:#e9f7ff;--muted:#9bbbd0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}
body{overflow-x:hidden}.app{width:min(100%,560px);margin:auto;min-height:100vh;padding:14px 12px 104px;position:relative}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 35%,#003c7626,transparent 45%),radial-gradient(circle at 50% 80%,#006eff12,transparent 38%)}
.header{height:76px;display:grid;grid-template-columns:52px 1fr 166px;gap:8px;align-items:center;border-bottom:1px solid #0b416d80}
.menu{width:44px;height:44px;border:0;background:none;color:#bde8ff;font-size:35px;line-height:1}.brand{text-align:center;font-size:28px;font-weight:900;direction:ltr}.brand b{color:var(--blue)}
.wallet{border:1px solid #087de0;border-radius:18px;padding:8px 11px;background:#031226;box-shadow:0 0 18px #007cff18;text-align:right}.wallet small{display:block;color:#b7d7e9;font-size:12px}.wallet strong{display:block;color:#10b4ff;font-size:17px;direction:ltr;text-align:right;margin-top:2px}
.title{display:flex;align-items:center;justify-content:center;gap:18px;margin:27px 0 8px;font-size:22px;font-weight:800}.title i{width:65px;height:2px;background:linear-gradient(90deg,transparent,var(--blue));display:block}.title i:last-child{background:linear-gradient(90deg,var(--blue),transparent)}
.mining-area{height:535px;position:relative;display:flex;align-items:center;justify-content:center}.platform{position:absolute;bottom:43px;width:78%;height:70px;border-radius:50%;border:2px solid #09a9ff99;background:radial-gradient(ellipse,#087dcc66,#020711 68%);box-shadow:0 0 25px #008cff44,inset 0 0 18px #0aaaff44}.platform:before,.platform:after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid #0aaaff66}.platform:after{inset:22px}
.orbit{position:absolute;width:86%;height:145px;border:3px solid #09aaff;border-left-color:transparent;border-right-color:#09aaffaa;border-radius:50%;transform:rotate(-12deg);box-shadow:0 0 16px #008cff88;opacity:.9}
.orbit:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#42d2ff;box-shadow:0 0 15px #0af;right:14%;top:5%}
.coin{
 position:relative;width:285px;height:285px;border-radius:50%;
 transform:perspective(900px) rotateY(-18deg) rotateX(5deg) rotateZ(-8deg);
 background:radial-gradient(circle at 34% 25%,#d7f8ff 0%,#5bd9ff 7%,#119fe9 24%,#0563a9 50%,#032a50 73%,#010711 100%);
 border:9px solid #27c8ff;
 box-shadow:0 0 18px #08adff,0 0 42px #008cffaa,0 0 90px #008cff3d,
 inset 7px 7px 16px #d4f9ff88,inset -18px -20px 30px #000d21ee;
 display:flex;align-items:center;justify-content:center;z-index:2;overflow:visible;
}
/* سماكة العملة: طبقات جانبية ظاهرة من اليسار والأسفل */
.coin:before{
 content:"";position:absolute;inset:-10px;border-radius:50%;
 background:linear-gradient(145deg,#0a72ae 0%,#034b7b 45%,#011b33 100%);
 transform:translate(-15px,14px);
 box-shadow:-3px 3px 0 #02345a,-6px 6px 0 #012744,-9px 9px 0 #011a2e,
 0 0 20px #008cff88;
 z-index:-3;
}
/* الوجه الأمامي والحلقات المعدنية */
.coin:after{
 content:"";position:absolute;inset:18px;border-radius:50%;
 border:3px solid #77e5ffbb;
 box-shadow:inset 0 0 0 7px #021a35cc,
 inset 0 0 0 10px #16baff66,
 inset 0 0 0 13px #031d39,
 inset 0 0 28px #9beeff55,
 0 0 12px #08b5ff77;
 z-index:1;
}
.coin-face{
 font-size:78px;font-weight:1000;letter-spacing:-6px;color:#f4fdff;
 transform:translate(3px,-3px) rotate(8deg);
 z-index:5;direction:ltr;
 text-shadow:3px 4px 0 #07568f,6px 8px 0 #022d52,9px 11px 0 #011c35,
 0 0 8px #d6f8ff,0 0 22px #19baff;
 filter:drop-shadow(0 9px 8px #001a33);
}
.coin-rim{
 position:absolute;inset:-25px;border-radius:50%;
 border:6px solid #0879bd;
 box-shadow:inset 0 0 10px #75e1ff66,0 0 15px #008cff88;
 z-index:-2;transform:rotate(3deg);
}
.coin-rim:after{
 content:"";position:absolute;inset:8px;border-radius:50%;
 border:2px dashed #31c8ff88;
}
.coin-shine{
 position:absolute;width:115px;height:45px;top:22px;left:45px;border-radius:50%;
 background:linear-gradient(90deg,#fff0,#dfffff88,#fff0);
 filter:blur(7px);transform:rotate(-28deg);z-index:6;pointer-events:none;
}
.stats{border:1px solid #087de0;border-radius:28px;background:linear-gradient(145deg,#06172d,#020b17);box-shadow:0 0 22px #008cff18;display:grid;grid-template-columns:1fr 1fr;padding:22px 10px;margin-bottom:22px}.stat{text-align:center;min-width:0}.stat+ .stat{border-right:1px solid #168bd855}.stat .icon{font-size:38px;color:#14b5ff;line-height:1}.stat .label{font-size:18px;color:#c8e5f5;margin-top:8px}.stat .value{font-size:25px;font-weight:900;color:#08adff;margin-top:8px;direction:ltr}.claim{width:72%;margin:0 auto 22px;display:block;border:0;border-radius:45px;padding:19px 20px;background:linear-gradient(135deg,#087cff,#0fc8ff);color:white;font-size:27px;font-weight:900;box-shadow:0 0 25px #009dff88,0 8px 35px #006dff33;cursor:pointer}.claim:disabled{opacity:.55}.msg{text-align:center;min-height:24px;color:#8fdcff;font-size:14px}
.nav{position:fixed;z-index:20;bottom:8px;left:50%;transform:translateX(-50%);width:min(calc(100% - 12px),548px);height:92px;border:1px solid #0758a6;border-radius:30px;background:linear-gradient(180deg,#020d1cF2,#010711F7);box-shadow:0 -5px 30px #007cff12;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px 4px}.nav button{background:none;border:0;color:#8faec3;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.nav .ico{font-size:28px;line-height:1}.nav button.active{color:#09b6ff;text-shadow:0 0 12px #00aaff88}.nav button.active:after{content:"";width:45px;height:3px;border-radius:5px;background:#08b5ff;box-shadow:0 0 12px #08b5ff;position:absolute;bottom:4px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#06203a;color:#dff7ff;border:1px solid #0b9eff;border-radius:12px;padding:10px 16px;z-index:30;display:none;font-size:13px}
@media(max-width:390px){.header{grid-template-columns:40px 1fr 145px}.brand{font-size:24px}.wallet strong{font-size:14px}.coin{width:235px;height:235px}.coin-face{font-size:60px}.mining-area{height:470px}.title{font-size:19px}.stats .label{font-size:15px}.stats .value{font-size:20px}.claim{width:80%}}

.coin-art-wrap{width:100%;height:535px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.coin-art{width:100%;max-width:510px;height:100%;object-fit:contain;object-position:center;mix-blend-mode:screen;filter:drop-shadow(0 0 24px #008cff66);transform:translateY(-4px);user-select:none;-webkit-user-drag:none;animation:coinFloat 3.8s ease-in-out infinite,coinGlow 2.4s ease-in-out infinite alternate;will-change:transform,filter}
@keyframes coinFloat{0%,100%{transform:translateY(-4px) scale(1)}50%{transform:translateY(-14px) scale(1.018)}}
@keyframes coinGlow{0%{filter:drop-shadow(0 0 18px #008cff55)}100%{filter:drop-shadow(0 0 42px #00aaffbb)}}
@media(max-width:390px){.coin-art-wrap{height:470px}.coin-art{max-width:430px}}
</style>
</head>

function drawTimer(){let s=Math.max(0,Math.floor((timerEnd-Date.now())/1000));let h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),x=String(s%60).padStart(2,'0');$('timer').textContent=`${h}:${m}:${x}`;setTimeout(drawTimer,1000)}
function show(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1200)}
async function load(){try{let d=await api('status');if(d.success===false)throw 0;balance(d.balance);timer(d.remaining_seconds??d.seconds_remaining??10800)}catch(e){$('msg').textContent='تعذر الاتصال بالسيرفر'}}
$('claim').onclick=async()=>{let b=$('claim');b.disabled=true;$('msg').textContent='جاري المطالبة...';try{let d=await api('claim');if(d.success){balance(d.balance);timer(d.remaining_seconds??d.seconds_remaining??10800);$('msg').textContent='تمت إضافة 3 LTF إلى رصيدك'}else $('msg').textContent=d.message||'لم تكتمل المطالبة'}catch(e){$('msg').textContent='حدث خطأ بالاتصال'}setTimeout(()=>b.disabled=false,1000)};
load();
</script>
</body>
