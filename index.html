function openTasks(){tasksOverlay.classList.add("show");document.body.style.overflow="hidden";loadTasks()}function closeTasks(){tasksOverlay.classList.remove("show");document.body.style.overflow=""}
quickTasks.onclick=openTasks;bottomTasks.onclick=openTasks;tasksClose.onclick=closeTasks;quickSwap.onclick=function(){showMessage("SWAP\n\nتبديل العملة");};
async function claimTask(code){if(!telegramUser)return showMessage("يجب فتح التطبيق من داخل Telegram.");try{const{data,error}=await supabaseClient.rpc("claim_ltf_task",{p_telegram_user_id:Number(telegramUser.id),p_task_code:code});if(error)throw error;const r=Array.isArray(data)?data[0]:data;if(r&&r.success===true){setBalance(r.new_balance);if(code==="telegram_join")taskState.telegram_joined=true;if(code==="youtube_join")taskState.youtube_joined=true;if(code==="login_2h")taskState.login_next_available_at=r.next_available_at||null;updateTaskButtons();startTaskTimer();showMessage("تمت إضافة 5 LTF بنجاح ✅");if(tg?.HapticFeedback)tg.HapticFeedback.notificationOccurred("success")}else showMessage(r?.message||"لا يمكن استلام المكافأة الآن.")}catch(e){showMessage("تعذر تنفيذ المهمة.\n\n"+e.message)}}
telegramTaskBtn.onclick=()=>{window.open("https://t.me/LTFMiner","_blank");setTimeout(()=>claimTask("telegram_join"),500)}
youtubeTaskBtn.onclick=()=>{window.open("https://youtube.com/@ltfminer","_blank");setTimeout(()=>claimTask("youtube_join"),500)}
loginTaskBtn.onclick=()=>{if(loginTaskBtn.disabled)return;claimTask("login_2h")};
async function init(){telegramUser=getTelegramUser();if(!telegramUser){claimBtn.disabled=true;statusEl.textContent="افتح التطبيق من داخل Telegram";return}updateUserUI();await loadStatus();await loadTasks()}
init();
</script>
