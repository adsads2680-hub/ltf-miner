<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020202">
<title>LTF Miner</title>

<style>
:root{
  --black:#020202;
  --black2:#070707;
  --gold:#f7b900;
  --gold2:#ffd84a;
  --gold3:#8d5900;
  --white:#fff8df;
  --muted:#c9c1aa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--black)}
body{
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}
button{font:inherit;border:0}

.app{
  width:100%;
  min-height:100svh;
  padding:10px 10px 24px;
  position:relative;
  background:
    radial-gradient(circle at 50% 36%,rgba(255,183,0,.13),transparent 24%),
    radial-gradient(circle at 50% 75%,rgba(255,173,0,.08),transparent 30%),
    #020202;
}

/* ---------- HEADER ---------- */
.header{
  height:76px;
  position:relative;
  display:flex;
  align-items:center;
  gap:9px;
  padding:7px 10px;
  border:1px solid #a66c00;
  border-radius:22px;
  background:linear-gradient(180deg,#111 0%,#050505 100%);
  box-shadow:
    0 0 20px rgba(255,185,0,.18),
    inset 0 0 20px rgba(255,204,50,.035);
}
.header:before{
  content:"";
  position:absolute;
  top:-1px;
  left:18%;
  right:18%;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent);
}
.logo-mini{
  width:58px;height:58px;flex:0 0 58px;
  border-radius:50%;
  display:grid;place-items:center;
  border:3px solid var(--gold);
  background:radial-gradient(circle at 35% 28%,#ffe986,#c67f00 52%,#170e00 82%);
  box-shadow:0 0 18px rgba(255,190,0,.45),inset 0 0 10px #fff2a0;
}
.logo-mini span{
  direction:ltr;
  color:#130d00;
  font-size:20px;
  font-weight:900;
  letter-spacing:-2px;
}
.brand{
  direction:ltr;
  text-align:left;
  line-height:1;
  flex:1;
}
.brand strong{
  display:block;
  color:#ffd63f;
  font-size:31px;
  letter-spacing:5px;
}
.brand small{
  display:block;
  margin-top:7px;
  color:#f4c43b;
  font-size:11px;
  letter-spacing:5px;
}
.balance{
  height:46px;
  min-width:126px;
  padding:0 10px;
  border:1px solid #a66c00;
  border-radius:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:#050505;
  white-space:nowrap;
  font-size:14px;
}
.balance .coin-dot{
  width:25px;height:25px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#ffe477,#a86b00);
  border:1px solid #ffd74a;
  color:#171000;
  font-size:9px;
  font-weight:900;
}
.balance b{color:#fff;direction:ltr}
.profile{
  width:46px;height:46px;flex:0 0 46px;
  border:1px solid #a66c00;border-radius:50%;
  background:#060606;
  color:#ffc928;
  display:grid;place-items:center;
  font-size:23px;
}

/* ---------- COIN ---------- */
.coin-zone{
  height:520px;
  position:relative;
  display:grid;
  place-items:center;
  overflow:hidden;
}
.coin-zone:before{
  content:"";
  position:absolute;
  width:420px;height:420px;
  border-radius:50%;
  border:1px solid rgba(246,183,0,.23);
  box-shadow:0 0 40px rgba(246,183,0,.08);
}
.orbit{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(247,185,0,.68);
  transform:rotate(-8deg);
}
.orbit.one{width:430px;height:150px}
.orbit.two{width:410px;height:145px;transform:rotate(22deg);opacity:.55}
.orbit.three{width:365px;height:125px;transform:rotate(-28deg);opacity:.35}

.pedestal{
  position:absolute;
  bottom:43px;
  width:min(88vw,570px);
  height:76px;
  border-radius:50%;
  background:
    radial-gradient(ellipse at center,#e6a800 0 4%,#4a2e00 20%,#080808 58%,transparent 70%);
  box-shadow:0 15px 35px rgba(255,180,0,.25);
}
.pedestal:before{
  content:"";
  position:absolute;
  left:9%;right:9%;top:13px;height:50px;
  border-radius:50%;
  border:3px solid #d89500;
  box-shadow:0 0 15px rgba(255,190,0,.5),inset 0 0 18px rgba(255,190,0,.25);
}
.coin{
  width:min(62vw,310px);
  height:min(62vw,310px);
  position:relative;
  z-index:2;
  border-radius:50%;
  display:grid;
  place-items:center;
  transform:translateY(-20px);
  background:
    radial-gradient(circle at 32% 22%,#fff1a0 0 3%,#ffc92e 16%,#c77e00 47%,#271800 70%,#080705 100%);
  border:10px solid #e1a000;
  box-shadow:
    0 0 0 5px #5a3900,
    0 0 0 9px #f1b600,
    0 0 40px rgba(255,190,20,.6),
    inset 0 0 28px rgba(255,239,147,.7);
}
.coin:before{
  content:"";
  position:absolute;
  inset:18px;
  border-radius:50%;
  border:2px solid rgba(255,220,80,.75);
  box-shadow:inset 0 0 30px rgba(0,0,0,.75);
}
.coin:after{
  content:"";
  position:absolute;
  bottom:-28px;
  width:70%;height:16px;
  border-radius:50%;
  background:rgba(255,190,0,.48);
  filter:blur(10px);
}
.coin-text{
  position:relative;
  z-index:4;
  direction:ltr;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ffd83f;
  font-size:clamp(60px,17vw,98px);
  font-weight:900;
  letter-spacing:-8px;
  text-shadow:
    0 3px 0 #a36000,
    0 6px 0 #5a3500,
    0 0 18px rgba(255,215,60,.65);
}
.coin-text .t{display:inline-block;transform:none}
.coin-text .f{margin-left:-2px}

/* ---------- TIMER ---------- */
.timer{
  width:min(92vw,760px);
  min-height:126px;
  margin:0 auto;
  padding:16px 12px;
  border:1px solid #b87700;
  border-radius:22px;
  background:linear-gradient(180deg,#0b0b0b,#040404);
  box-shadow:
    0 0 22px rgba(245,185,0,.12),
    inset 0 0 18px rgba(255,210,60,.03);
  text-align:center;
}
.time{
  direction:ltr;
  color:#ffd544;
  font-size:clamp(36px,9vw,58px);
  line-height:1;
  font-weight:900;
  letter-spacing:2px;
}
.timer p{
  margin:13px 0 0;
  color:#eee8d7;
  font-size:14px;
}

/* ---------- CLAIM ---------- */
.claim{
  width:min(84vw,600px);
  height:84px;
  margin:24px auto 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  border-radius:25px;
  border:2px solid #f4bf20;
  color:#ffd94a;
  background:linear-gradient(180deg,#15100a,#050505);
  box-shadow:
    0 0 28px rgba(255,188,0,.32),
    inset 0 0 20px rgba(255,190,0,.08);
  cursor:pointer;
}
.claim .reward{
  font-size:34px;
  font-weight:900;
  direction:ltr;
}
.claim .divider{
  width:1px;height:42px;background:#b77b00;
}
.claim .label{
  font-size:24px;
  font-weight:900;
  letter-spacing:1px;
}
.claim.disabled{
  opacity:.65;
  cursor:not-allowed;
}

/* ---------- ACTIONS ---------- */
.actions{
  width:min(94vw,800px);
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.action{
  min-height:142px;
  border:1px solid #a96d00;
  border-radius:18px;
  background:linear-gradient(180deg,#0d0d0d,#040404);
  color:#fff1a9;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  text-align:center;
  box-shadow:inset 0 0 17px rgba(255,190,0,.025);
  cursor:pointer;
}
.action .icon{
  width:52px;height:52px;
  border:1px solid #d19a16;
  border-radius:50%;
  display:grid;place-items:center;
  color:#ffd83f;
  font-size:26px;
  box-shadow:0 0 13px rgba(255,190,0,.14);
}
.action strong{font-size:15px}
.action span{font-size:11px;color:#aaa28d}

/* ---------- STATUS ---------- */
.status{
  min-height:25px;
  margin-top:11px;
  text-align:center;
  color:#ffd83f;
  font-size:13px;
}

@media(max-width:600px){
  .header{height:68px;padding:6px 7px}
  .logo-mini{width:50px;height:50px;flex-basis:50px}
  .logo-mini span{font-size:17px}
  .brand strong{font-size:25px;letter-spacing:4px}
  .brand small{font-size:9px;letter-spacing:3px}
  .balance{min-width:91px;height:40px;font-size:11px;padding:0 6px}
  .balance .coin-dot{width:21px;height:21px;font-size:7px}
  .profile{width:40px;height:40px;flex-basis:40px;font-size:20px}
  .coin-zone{height:430px}
  .coin{transform:translateY(-10px)}
  .orbit.one{width:390px;height:135px}
  .orbit.two{width:360px;height:125px}
  .orbit.three{width:325px;height:112px}
  .pedestal{bottom:28px}
  .timer{min-height:116px}
  .claim{height:76px;margin-top:20px}
  .claim .reward{font-size:29px}
  .claim .label{font-size:21px}
  .actions{gap:7px}
  .action{min-height:116px;padding:6px 3px}
  .action .icon{width:45px;height:45px;font-size:22px}
  .action strong{font-size:12px}
  .action span{font-size:9px}
}
@media(max-width:380px){
  .balance{min-width:82px}
  .brand strong{font-size:22px}
  .coin-zone{height:400px}
  .actions{gap:5px}
}
</style>
</head>

<body>
<main class="app">

<header class="header">
  <div class="logo-mini"><span>LTF</span></div>

  <div class="brand">
    <strong>LTF</strong>
    <small>MINER</small>
  </div>

  <div class="balance">
    <div class="coin-dot">LTF</div>
    <b id="balance">0.000</b>&nbsp;LTF
  </div>

  <div class="profile" aria-label="Profile">●</div>
</header>

<section class="coin-zone">
  <div class="orbit one"></div>
  <div class="orbit two"></div>
  <div class="orbit three"></div>

  <div class="pedestal"></div>

  <div class="coin" aria-label="LTF Coin">
    <div class="coin-text">
      <span>L</span><span class="t">T</span><span class="f">F</span>
    </div>
  </div>
</section>

<section class="timer">
  <div class="time" id="timer">01:00:00</div>
  <p>الوقت المتبقي حتى يمكنك الحصول على مكافأتك</p>
</section>

<button class="claim disabled" id="claim" disabled>
  <span class="reward">+1 LTF</span>
  <span class="divider"></span>
  <span class="label">CLAIM</span>
</button>

<section class="actions">
  <button class="action" onclick="message('سيتم تفعيل SWAP قريباً')">
    <div class="icon">⇄</div>
    <strong>SWAP</strong>
    <span>تبديل العملة</span>
  </button>

  <button class="action" onclick="message('المهام اليومية قيد التجهيز')">
    <div class="icon">✓</div>
    <strong>المهام</strong>
    <span>أكمل المهام اليومية</span>
  </button>

  <button class="action" onclick="message('رفع قوة التعدين قيد التجهيز')">
    <div class="icon">⛏</div>
    <strong>ارفع قوة التعدين</strong>
    <span>زد من سرعة التعدين</span>
  </button>
</section>

<div class="status" id="status"></div>

</main>

<script>
const CLAIM_INTERVAL = 60 * 60 * 1000;

const balanceEl = document.getElementById("balance");
const timerEl = document.getElementById("timer");
const claimBtn = document.getElementById("claim");
const statusEl = document.getElementById("status");

let balance = Number(localStorage.getItem("ltf_balance") || "0");
let nextClaim = Number(localStorage.getItem("ltf_next_claim") || "0");

function save(){
  localStorage.setItem("ltf_balance", balance.toFixed(3));
  localStorage.setItem("ltf_next_claim", String(nextClaim));
}

function render(){
  balanceEl.textContent = balance.toFixed(3);

  const left = Math.max(0, nextClaim - Date.now());

  if(left <= 0){
    timerEl.textContent = "00:00:00";
    claimBtn.disabled = false;
    claimBtn.classList.remove("disabled");
    return;
  }

  const totalSeconds = Math.floor(left / 1000);
  const h = String(Math.floor(totalSeconds / 3600)).padStart(2,"0");
  const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2,"0");
  const s = String(totalSeconds % 60).padStart(2,"0");

  timerEl.textContent = `${h}:${m}:${s}`;
  claimBtn.disabled = true;
  claimBtn.classList.add("disabled");
}

claimBtn.addEventListener("click",()=>{
  if(nextClaim > Date.now()) return;

  balance += 1;
  nextClaim = Date.now() + CLAIM_INTERVAL;

  save();
  statusEl.textContent = "تمت إضافة 1 LTF إلى رصيدك";
  render();
});

function message(text){
  statusEl.textContent = text;
  setTimeout(()=>{
    if(statusEl.textContent === text) statusEl.textContent = "";
  },2500);
}

render();
setInterval(render,1000);
</script>

</body>
</html>
