<script>

/* =========================================
   TELEGRAM MINI APP
========================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if(tg){
  try{ tg.ready(); }catch(e){}
  try{ tg.expand(); }catch(e){}

  try{
    if(typeof tg.setHeaderColor === "function"){
      tg.setHeaderColor("#020202");
    }
  }catch(e){}

  try{
    if(typeof tg.setBackgroundColor === "function"){
      tg.setBackgroundColor("#020202");
    }
  }catch(e){}
}


/* =========================================
   TELEGRAM USER
========================================= */

let telegramUserId = "guest";

if(
  tg &&
  tg.initDataUnsafe &&
  tg.initDataUnsafe.user &&
  tg.initDataUnsafe.user.id
){
  telegramUserId =
    String(tg.initDataUnsafe.user.id);
}

const USER_KEY =
  telegramUserId.replace(
    /[^a-zA-Z0-9_-]/g,
    "_"
  );


/* =========================================
   LTF MINER
   3 LTF كل 3 ساعات
========================================= */

const MINING_DURATION =
  3 * 60 * 60 * 1000;

const MINING_REWARD = 3;

const BALANCE_KEY =
  "ltf_balance_v13_" + USER_KEY;

const START_KEY =
  "ltf_mining_start_v13_" + USER_KEY;


/* =========================================
   ELEMENTS
========================================= */

const balanceEl =
  document.getElementById("balanceValue");

const minedEl =
  document.getElementById("minedValue");

const timerTextEl =
  document.getElementById("timerText");

const claimBtn =
  document.getElementById("claimBtn");


/* =========================================
   BALANCE
========================================= */

function getBalance(){

  const value =
    parseFloat(
      localStorage.getItem(BALANCE_KEY)
    );

  return Number.isFinite(value)
    ? value
    : 0;
}


function setBalance(value){

  const safeValue =
    Math.max(0, Number(value) || 0);

  localStorage.setItem(
    BALANCE_KEY,
    safeValue.toFixed(6)
  );
}


/* =========================================
   MINING START
========================================= */

function getMiningStart(){

  let start =
    parseInt(
      localStorage.getItem(START_KEY),
      10
    );

  if(!Number.isFinite(start) || start <= 0){

    start = Date.now();

    localStorage.setItem(
      START_KEY,
      String(start)
    );
  }

  return start;
}


/* =========================================
   FORMAT
========================================= */

function formatLTF(value){

  return Number(value || 0)
    .toFixed(6);
}


/* =========================================
   TIME
========================================= */

function formatTime(ms){

  const totalSeconds =
    Math.max(
      0,
      Math.floor(ms / 1000)
    );

  const hours =
    Math.floor(
      totalSeconds / 3600
    );

  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );

  const seconds =
    totalSeconds % 60;

  return (
    String(hours).padStart(2,"0") +
    ":" +
    String(minutes).padStart(2,"0") +
    ":" +
    String(seconds).padStart(2,"0")
  );
}


/* =========================================
   ACCUMULATED
========================================= */

function getAccumulated(){

  const start = getMiningStart();
  const now = Date.now();

  let elapsed = now - start;

  if(elapsed < 0){
    elapsed = 0;
  }

  const progress =
    Math.min(
      elapsed / MINING_DURATION,
      1
    );

  return MINING_REWARD * progress;
}


/* =========================================
   RENDER
========================================= */

function render(){

  const balance = getBalance();

  const start = getMiningStart();

  const now = Date.now();

  let elapsed = now - start;

  if(elapsed < 0){
    elapsed = 0;
  }

  const progress =
    Math.min(
      elapsed / MINING_DURATION,
      1
    );

  const mined =
    MINING_REWARD * progress;


  minedEl.textContent =
    formatLTF(mined);


  if(elapsed >= MINING_DURATION){

    timerTextEl.textContent =
      "3 LTF جاهزة — اضغط CLAIM";

    claimBtn.disabled = false;

    claimBtn.style.opacity = "1";

  }else{

    const remaining =
      MINING_DURATION - elapsed;

    timerTextEl.textContent =
      "متبقي " +
      formatTime(remaining);

    claimBtn.disabled = false;

    claimBtn.style.opacity = "1";
  }


  balanceEl.textContent =
    formatLTF(balance);


  /* تحديث أرصدة النوافذ إن كانت موجودة */

  const swapBalanceEl =
    document.getElementById("swapBalance");

  if(swapBalanceEl){
    swapBalanceEl.textContent =
      formatLTF(balance);
  }

  const withdrawBalanceEl =
    document.getElementById("withdrawBalance");

  if(withdrawBalanceEl){
    withdrawBalanceEl.textContent =
      formatLTF(balance);
  }
}


/* =========================================
   CLAIM
========================================= */

claimBtn.addEventListener(
  "click",
  function(){

    const accumulated =
      getAccumulated();

    if(accumulated <= 0){
      render();

      alert(
        "التعدين لم يكتمل بعد"
      );

      return;
    }


    const reward =
      Math.min(
        accumulated,
        MINING_REWARD
      );


    const currentBalance =
      getBalance();


    const newBalance =
      currentBalance + reward;


    setBalance(newBalance);


    /*
      إعادة تشغيل دورة التعدين
    */

    localStorage.setItem(
      START_KEY,
      String(Date.now())
    );


    render();


    if(
      tg &&
      tg.HapticFeedback
    ){

      try{
        tg.HapticFeedback
          .notificationOccurred("success");
      }catch(e){}
    }


    alert(
      "تمت إضافة " +
      formatLTF(reward) +
      " LTF إلى رصيدك"
    );

  }
);


/* =========================================
   SWAP ELEMENTS
========================================= */

const swapAction =
  document.getElementById("swapAction");

const swapOverlay =
  document.getElementById("swapOverlay");

const swapClose =
  document.getElementById("swapClose");

const swapAmount =
  document.getElementById("swapAmount");

const swapBalance =
  document.getElementById("swapBalance");

const swapOutput =
  document.getElementById("swapOutput");

const usdtOption =
  document.getElementById("usdtOption");

const tonOption =
  document.getElementById("tonOption");

const swapConfirm =
  document.getElementById("swapConfirm");

const tonLivePrice =
  document.getElementById("tonLivePrice");


let swapTarget = "USDT";


/* =========================================
   SWAP LIMIT
========================================= */

const MIN_SWAP_AMOUNT = 10;


/* =========================================
   LTF PRICE
   300 LTF = 1 USDT
========================================= */

const LTF_USDT_PRICE =
  1 / 300;


/* =========================================
   TON PRICE
========================================= */

let tonUsdPrice = null;
let tonPriceLoading = false;

const TON_PRICE_KEY =
  "ltf_live_gram_price";

const TON_PRICE_TIME_KEY =
  "ltf_live_gram_price_time";


function loadCachedTonPrice(){

  const cached =
    parseFloat(
      localStorage.getItem(
        TON_PRICE_KEY
      )
    );

  if(
    Number.isFinite(cached) &&
    cached > 0
  ){
    tonUsdPrice = cached;
  }
}


loadCachedTonPrice();


function formatTonPrice(price){

  if(
    !Number.isFinite(price) ||
    price <= 0
  ){
    return "—";
  }

  if(price >= 100){
    return price.toFixed(2);
  }

  if(price >= 10){
    return price.toFixed(3);
  }

  return price.toFixed(4);
}


function saveTonPrice(price){

  tonUsdPrice = price;

  localStorage.setItem(
    TON_PRICE_KEY,
    String(price)
  );

  localStorage.setItem(
    TON_PRICE_TIME_KEY,
    String(Date.now())
  );

  if(tonLivePrice){

    tonLivePrice.textContent =
      "سعر TON (GRAM): $" +
      formatTonPrice(price) +
      " USDT";
  }
}


/* =========================================
   FETCH TON PRICE
========================================= */

async function fetchTonPrice(){

  if(tonPriceLoading){
    return;
  }

  tonPriceLoading = true;

  let freshPrice = NaN;


  try{

    try{

      const response =
        await fetch(
          "https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=usd",
          {
            method:"GET",
            cache:"no-store"
          }
        );


      if(!response.ok){
        throw new Error(
          "CoinGecko request failed"
        );
      }


      const data =
        await response.json();


      freshPrice =
        data &&
        data["the-open-network"]
          ? parseFloat(
              data["the-open-network"].usd
            )
          : NaN;


    }catch(error){

      console.warn(
        "TON price unavailable:",
        error
      );

    }


    if(
      Number.isFinite(freshPrice) &&
      freshPrice > 0
    ){

      saveTonPrice(freshPrice);

    }else if(
      Number.isFinite(tonUsdPrice) &&
      tonUsdPrice > 0
    ){

      if(tonLivePrice){

        tonLivePrice.textContent =
          "آخر سعر TON (GRAM): $" +
          formatTonPrice(tonUsdPrice) +
          " USDT";
      }

    }else{

      if(tonLivePrice){

        tonLivePrice.textContent =
          "سعر TON غير متاح حالياً";
      }
    }


    updateSwapOutput();


  }catch(error){

    console.warn(
      "TON price error:",
      error
    );

  }finally{

    tonPriceLoading = false;

  }
}


/* =========================================
   SWAP CALCULATION
========================================= */

function updateSwapOutput(){

  if(!swapAmount || !swapOutput){
    return;
  }


  const amount =
    parseFloat(
      swapAmount.value
    );


  if(
    !Number.isFinite(amount) ||
    amount <= 0
  ){

    swapOutput.textContent =
      "0.000000 " +
      swapTarget;

    return;
  }


  if(swapTarget === "USDT"){

    const usdtAmount =
      amount *
      LTF_USDT_PRICE;


    swapOutput.textContent =
      usdtAmount.toFixed(6) +
      " USDT";

    return;
  }


  if(
    !Number.isFinite(tonUsdPrice) ||
    tonUsdPrice <= 0
  ){

    swapOutput.textContent =
      "جاري جلب سعر TON...";

    return;
  }


  /*
    قيمة LTF بالدولار:
    1 LTF = 1/300 USDT

    عدد TON =
    قيمة LTF بالدولار ÷ سعر TON
  */

  const usdValue =
    amount *
    LTF_USDT_PRICE;


  const tonAmount =
    usdValue /
    tonUsdPrice;


  swapOutput.textContent =
    tonAmount.toFixed(6) +
    " TON";
}


/* =========================================
   OPEN SWAP
========================================= */

if(swapAction){

  swapAction.addEventListener(
    "click",
    function(){

      swapBalance.textContent =
        formatLTF(getBalance());

      swapAmount.value = "";

      updateSwapOutput();

      swapOverlay.classList.add("open");

      fetchTonPrice();


      if(
        tg &&
        tg.HapticFeedback
      ){

        try{
          tg.HapticFeedback
            .impactOccurred("light");
        }catch(e){}
      }
    }
  );
}


/* =========================================
   CLOSE SWAP
========================================= */

function closeSwap(){

  swapOverlay.classList.remove("open");
}


if(swapClose){

  swapClose.addEventListener(
    "click",
    closeSwap
  );
}


swapOverlay.addEventListener(
  "click",
  function(e){

    if(e.target === swapOverlay){
      closeSwap();
    }
  }
);


/* =========================================
   USDT
========================================= */

usdtOption.addEventListener(
  "click",
  function(){

    swapTarget = "USDT";

    usdtOption.classList.add("active");

    tonOption.classList.remove("active");

    updateSwapOutput();
  }
);


/* =========================================
   TON
========================================= */

tonOption.addEventListener(
  "click",
  function(){

    swapTarget = "TON";

    tonOption.classList.add("active");

    usdtOption.classList.remove("active");

    updateSwapOutput();

    fetchTonPrice();
  }
);


/* =========================================
   SWAP INPUT
========================================= */

swapAmount.addEventListener(
  "input",
  updateSwapOutput
);


/* =========================================
   SWAP CONFIRM
========================================= */

swapConfirm.addEventListener(
  "click",
  function(){

    const amount =
      parseFloat(
        swapAmount.value
      );

    const balance =
      getBalance();


    if(
      !Number.isFinite(amount) ||
      amount <= 0
    ){

      alert(
        "أدخل كمية LTF صحيحة"
      );

      return;
    }


    if(amount < MIN_SWAP_AMOUNT){

      alert(
        "الحد الأدنى للتبديل هو 10 LTF"
      );

      return;
    }


    if(amount > balance){

      alert(
        "رصيد LTF غير كافٍ"
      );

      return;
    }


    /*
      لا يتم خصم الرصيد حالياً
      لأن التحويل الحقيقي يحتاج
      Backend ومحفظة وسيولة.
    */

    const output =
      swapOutput.textContent;


    alert(
      "تم تجهيز عملية SWAP\n\n" +
      "المبلغ: " +
      formatLTF(amount) +
      " LTF\n" +
      "تحويل إلى: " +
      swapTarget +
      "\n" +
      "الناتج المتوقع: " +
      output
    );


    if(
      tg &&
      tg.HapticFeedback
    ){

      try{
        tg.HapticFeedback
          .notificationOccurred("success");
      }catch(e){}
    }

  }
);


/* =========================================
   WITHDRAW
========================================= */

const withdrawAction =
  document.getElementById(
    "withdrawAction"
  );

const withdrawOverlay =
  document.getElementById(
    "withdrawOverlay"
  );

const withdrawClose =
  document.getElementById(
    "withdrawClose"
  );

const withdrawBalance =
  document.getElementById(
    "withdrawBalance"
  );

const withdrawAmount =
  document.getElementById(
    "withdrawAmount"
  );

const withdrawWallet =
  document.getElementById(
    "withdrawWallet"
  );

const withdrawNetworkAddress =
  document.getElementById(
    "withdrawNetworkAddress"
  );

const withdrawConfirm =
  document.getElementById(
    "withdrawConfirm"
  );

const withdrawSuccess =
  document.getElementById(
    "withdrawSuccess"
  );


/* =========================================
   WITHDRAW SETTINGS
   مطابق للواجهة
========================================= */

const MIN_WITHDRAW_AMOUNT = 200;

const WITHDRAW_FEE = 20;


/* =========================================
   OPEN WITHDRAW
========================================= */

withdrawAction.addEventListener(
  "click",
  function(){

    withdrawBalance.textContent =
      formatLTF(getBalance());

    withdrawAmount.value = "";

    withdrawWallet.value = "";

    withdrawNetworkAddress.value = "";

    withdrawSuccess.classList.remove(
      "show"
    );

    withdrawSuccess.textContent = "";

    withdrawOverlay.classList.add(
      "open"
    );


    if(
      tg &&
      tg.HapticFeedback
    ){

      try{
        tg.HapticFeedback
          .impactOccurred("light");
      }catch(e){}
    }

  }
);


/* =========================================
   CLOSE WITHDRAW
========================================= */

function closeWithdraw(){

  withdrawOverlay.classList.remove(
    "open"
  );
}


withdrawClose.addEventListener(
  "click",
  closeWithdraw
);


withdrawOverlay.addEventListener(
  "click",
  function(e){

    if(e.target === withdrawOverlay){

      closeWithdraw();
    }
  }
);


/* =========================================
   BEP20 VALIDATION
========================================= */

function isValidBep20Address(address){

  return /^0x[a-fA-F0-9]{40}$/.test(
    String(address).trim()
  );
}


/* =========================================
   WITHDRAW REQUEST
========================================= */

withdrawConfirm.addEventListener(
  "click",
  function(){

    const amount =
      parseFloat(
        withdrawAmount.value
      );


    const wallet =
      String(
        withdrawWallet.value || ""
      ).trim();


    const networkAddress =
      String(
        withdrawNetworkAddress.value || ""
      ).trim();


    const balance =
      getBalance();


    /* الكمية */

    if(
      !Number.isFinite(amount) ||
      amount <= 0
    ){

      alert(
        "أدخل كمية السحب"
      );

      return;
    }


    /* الحد الأدنى */

    if(
      amount < MIN_WITHDRAW_AMOUNT
    ){

      alert(
        "الحد الأدنى للسحب هو 200 LTF"
      );

      return;
    }


    /* الرصيد */

    if(amount > balance){

      alert(
        "رصيد LTF غير كافٍ"
      );

      return;
    }


    /* المحفظة */

    if(!wallet){

      alert(
        "أدخل عنوان محفظة USDT"
      );

      withdrawWallet.focus();

      return;
    }


    /* عنوان الشبكة */

    if(!networkAddress){

      alert(
        "أدخل عنوان شبكة BNB20"
      );

      withdrawNetworkAddress.focus();

      return;
    }


    /* تحقق العنوان */

    if(
      !isValidBep20Address(wallet)
    ){

      alert(
        "عنوان محفظة USDT غير صحيح لشبكة BNB20"
      );

      withdrawWallet.focus();

      return;
    }


    if(
      !isValidBep20Address(
        networkAddress
      )
    ){

      alert(
        "عنوان شبكة BNB20 غير صحيح"
      );

      withdrawNetworkAddress.focus();

      return;
    }


    /* الرسوم */

    const netAmount =
      amount -
      WITHDRAW_FEE;


    if(netAmount <= 0){

      alert(
        "المبلغ غير صالح بعد خصم الرسوم"
      );

      return;
    }


    /* =====================================
       حفظ الطلب
    ===================================== */

    const WITHDRAW_KEY =
      "ltf_withdraw_requests_v1_" +
      USER_KEY;


    let requests = [];


    try{

      const saved =
        JSON.parse(
          localStorage.getItem(
            WITHDRAW_KEY
          ) || "[]"
        );


      if(Array.isArray(saved)){
        requests = saved;
      }

    }catch(e){

      requests = [];
    }


    const request = {

      id:
        "LTF-" +
        Date.now() +
        "-" +
        Math.floor(
          Math.random() * 100000
        ),

      user_id:
        telegramUserId,

      amount:
        Number(
          amount.toFixed(6)
        ),

      fee:
        WITHDRAW_FEE,

      net_amount:
        Number(
          netAmount.toFixed(6)
        ),

      token:
        "USDT",

      network:
        "BNB Smart Chain (BEP-20)",

      wallet_address:
        wallet,

      network_address:
        networkAddress,

      status:
        "pending",

      created_at:
        new Date().toISOString()
    };


    requests.push(request);


    localStorage.setItem(
      WITHDRAW_KEY,
      JSON.stringify(requests)
    );


    /* خصم المبلغ */

    setBalance(
      balance - amount
    );


    render();


    withdrawBalance.textContent =
      formatLTF(getBalance());


    withdrawSuccess.textContent =
      "تم إنشاء طلب السحب بنجاح. " +
      "المبلغ: " +
      formatLTF(amount) +
      " LTF — " +
      "الرسوم: " +
      formatLTF(WITHDRAW_FEE) +
      " LTF — " +
      "الصافي: " +
      formatLTF(netAmount) +
      " LTF. " +
      "رقم الطلب: " +
      request.id;


    withdrawSuccess.classList.add(
      "show"
    );


    withdrawAmount.value = "";

    withdrawWallet.value = "";

    withdrawNetworkAddress.value = "";


    if(
      tg &&
      tg.HapticFeedback
    ){

      try{
        tg.HapticFeedback
          .notificationOccurred("success");
      }catch(e){}
    }

  }
);


/* =========================================
   TASKS
========================================= */

const actionCards =
  document.querySelectorAll(
    ".action"
  );


if(actionCards.length >= 3){

  actionCards[2].addEventListener(
    "click",
    function(){

      alert(
        "TASKS\n\n" +
        "المهام ستكون متاحة قريباً."
      );


      if(
        tg &&
        tg.HapticFeedback
      ){

        try{
          tg.HapticFeedback
            .impactOccurred("light");
        }catch(e){}
      }

    }
  );
}


/* =========================================
   POWER
========================================= */

if(actionCards.length >= 4){

  actionCards[3].addEventListener(
    "click",
    function(){

      alert(
        "POWER\n\n" +
        "نظام التعدين يعمل حالياً.\n" +
        "المعدل الحالي: 3 LTF كل 3 ساعات."
      );


      if(
        tg &&
        tg.HapticFeedback
      ){

        try{
          tg.HapticFeedback
            .impactOccurred("light");
        }catch(e){}
      }

    }
  );
}


/* =========================================
   TELEGRAM BACK BUTTON
========================================= */

if(
  tg &&
  tg.BackButton
){

  try{
    tg.BackButton.hide();
  }catch(e){}
}


/* =========================================
   START
========================================= */

render();


setInterval(
  render,
  1000
);


/* تحديث سعر TON كل دقيقة */

fetchTonPrice();


setInterval(
  fetchTonPrice,
  60000
);


/* =========================================
   حماية من أخطاء غير متوقعة
========================================= */

window.addEventListener(
  "error",
  function(event){

    console.error(
      "LTF Miner error:",
      event.error || event.message
    );

  }
);

</script>
