<script>

/* =========================================
   TELEGRAM MINI APP
========================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


if(tg){

  try{
    tg.ready();
  }catch(e){}

  try{
    tg.expand();
  }catch(e){}

  try{
    if(typeof tg.setHeaderColor === "function"){
      tg.setHeaderColor("#020202");
    }
  }catch(e){}

  try{
    if(typeof tg.setBackgroundColor === "function"){
      tg.setBackgroundColor("#020202");
    }
  }catch(e){}

}


/* =========================================
   TELEGRAM USER
========================================= */

let telegramUserId = "guest";

if(
  tg &&
  tg.initDataUnsafe &&
  tg.initDataUnsafe.user &&
  tg.initDataUnsafe.user.id
){

  telegramUserId =
    String(
      tg.initDataUnsafe.user.id
    );

}


const USER_KEY =
  telegramUserId
    .replace(/[^a-zA-Z0-9_-]/g,"_");


/* =========================================
   LTF MINER
   3 LTF كل 3 ساعات
========================================= */

const MINING_DURATION =
  3 * 60 * 60 * 1000;

const MINING_REWARD = 3;


const BALANCE_KEY =
  "ltf_balance_v13_" +
  USER_KEY;

const START_KEY =
  "ltf_mining_start_v13_" +
  USER_KEY;


const balanceEl =
  document.getElementById(
    "balanceValue"
  );

const minedEl =
  document.getElementById(
    "minedValue"
  );

const timerTextEl =
  document.getElementById(
    "timerText"
  );

const claimBtn =
  document.getElementById(
    "claimBtn"
  );


/* =========================================
   BALANCE
========================================= */

function getBalance(){

  const value =
    parseFloat(
      localStorage.getItem(
        BALANCE_KEY
      )
    );

  return Number.isFinite(value)
    ? value
    : 0;

}


function setBalance(value){

  localStorage.setItem(
    BALANCE_KEY,
    Number(value).toFixed(6)
  );

}


/* =========================================
   MINING START
========================================= */

function getMiningStart(){

  let start =
    parseInt(
      localStorage.getItem(
        START_KEY
      ),
      10
    );


  if(!Number.isFinite(start)){

    start =
      Date.now();

    localStorage.setItem(
      START_KEY,
      String(start)
    );

  }


  return start;

}


/* =========================================
   FORMAT
========================================= */

function formatLTF(value){

  return Number(value)
    .toFixed(6);

}


/* =========================================
   TIME
========================================= */

function formatTime(ms){

  const totalSeconds =
    Math.max(
      0,
      Math.floor(
        ms / 1000
      )
    );


  const hours =
    Math.floor(
      totalSeconds / 3600
    );


  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );


  const seconds =
    totalSeconds % 60;


  return (
    String(hours).padStart(2,"0")
    + ":" +
    String(minutes).padStart(2,"0")
    + ":" +
    String(seconds).padStart(2,"0")
  );

}


/* =========================================
   RENDER
========================================= */

function render(){

  const balance =
    getBalance();


  const start =
    getMiningStart();


  const now =
    Date.now();


  let elapsed =
    now - start;


  if(elapsed < 0){
    elapsed = 0;
  }


  if(elapsed >= MINING_DURATION){

    minedEl.textContent =
      formatLTF(
        MINING_REWARD
      );


    timerTextEl.textContent =
      "التعدين مكتمل — اضغط CLAIM";


    claimBtn.disabled =
      false;


    claimBtn.classList.remove(
      "disabled"
    );


  }else{

    const progress =
      elapsed /
      MINING_DURATION;


    const mined =
      MINING_REWARD *
      progress;


    minedEl.textContent =
      formatLTF(
        mined
      );


    const remaining =
      MINING_DURATION -
      elapsed;


    timerTextEl.textContent =
      "متبقي " +
      formatTime(
        remaining
      );


    claimBtn.disabled =
      true;


    claimBtn.classList.add(
      "disabled"
    );

  }


  balanceEl.textContent =
    formatLTF(
      balance
    );

}


/* =========================================
   CLAIM
========================================= */

claimBtn.addEventListener(
  "click",
  function(){

    if(
      claimBtn.disabled
    ){
      return;
    }


    const currentBalance =
      getBalance();


    const newBalance =
      currentBalance +
      MINING_REWARD;


    setBalance(
      newBalance
    );


    localStorage.setItem(
      START_KEY,
      String(
        Date.now()
      )
    );


    render();


    if(
      tg &&
      tg.HapticFeedback
    ){

      try{

        tg.HapticFeedback
          .notificationOccurred(
            "success"
          );

      }catch(e){}

    }

  }
);


/* =========================================
   TELEGRAM BACK BUTTON
========================================= */

if(
  tg &&
  tg.BackButton
){

  try{
    tg.BackButton.hide();
  }catch(e){}

}


/* =========================================
   START
========================================= */

render();

setInterval(
  render,
  1000
);

</script>

</body>
</html>
