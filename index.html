<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>LTF Miner</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 430px;
      margin: auto;
      min-height: 100vh;
      padding: 15px;
    }

    .top {
      height: 105px;
      padding: 15px 7px;
      display: grid;
      grid-template-columns: 100px 1fr 100px;
      align-items: center;
      gap: 6px;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar {
      width: 58px;
      height: 58px;
      border: 2px solid #51401d;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #d6a92d;
    }

    .user-name {
      font-size: 16px;
      color: #aaa;
    }

    .level {
      display: inline-block;
      margin-top: 5px;
      padding: 7px 12px;
      border: 1px solid #00a878;
      border-radius: 20px;
      color: #00b88a;
      font-size: 14px;
    }

    .logo {
      text-align: center;
    }

    .logo-main {
      font-size: 58px;
      font-weight: bold;
      color: #c99920;
      letter-spacing: 3px;
    }

    .logo-sub {
      font-size: 11px;
      color: #777;
      letter-spacing: 5px;
      margin-top: 2px;
    }

    .icons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .icon-box {
      width: 75px;
      height: 75px;
      border: 1px solid #4a3810;
      border-radius: 20px;
      text-align: center;
      padding-top: 8px;
      color: #aaa;
    }

    .icon-box .emoji {
      font-size: 31px;
      display: block;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border: 1px solid #4a3810;
      border-radius: 28px;
      margin-top: 5px;
      padding: 25px 8px;
      background: #030303;
    }

    .stat {
      text-align: center;
      border-right: 1px solid #292929;
      padding: 0 5px;
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat-title {
      color: #777;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .stat-value {
      font-size: 43px;
      color: #00a77d;
      white-space: nowrap;
    }

    .stat:nth-child(2) .stat-value {
      color: #b58a20;
      font-size: 39px;
    }

    .stat-sub {
      color: #777;
      margin-top: 10px;
      font-size: 15px;
    }

    .mine {
      margin-top: 30px;
      border: 1px solid #4a3810;
      border-radius: 28px;
      padding: 35px 20px 25px;
      text-align: center;
      background:
        radial-gradient(circle at center, #704700 0%, #1c1203 38%, #030303 68%);
    }

    .coin {
      width: 100%;
      aspect-ratio: 0.72;
      max-height: 690px;
      margin: auto;
      border: 4px double #a47512;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 35px rgba(180, 120, 0, .45),
        inset 0 0 50px rgba(190, 130, 0, .3);
    }

    .coin-text {
      color: #aaa;
      font-size: 31px;
    }

    .claim-btn {
      width: 92%;
      margin-top: 45px;
      border: 2px solid #16865e;
      border-radius: 55px;
      background: #08663f;
      color: #aaa;
      font-size: 37px;
      padding: 20px 10px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 190, 120, .3);
    }

    .claim-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .countdown {
      margin-top: 15px;
      color: #777;
      font-size: 16px;
    }

    .countdown span {
      color: #00a77d;
      font-size: 20px;
      font-weight: bold;
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 25px;
    }

    .nav div {
      border: 1px solid #382b0d;
      border-radius: 20px;
      min-height: 85px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #777;
      font-size: 13px;
    }

    .nav div span {
      font-size: 28px;
      margin-bottom: 7px;
    }

    .loading {
      color: #777;
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="top">

    <div class="user">
      <div class="avatar" id="avatar">L</div>

      <div>
        <div class="user-name" id="username">LTF Miner</div>
        <div class="level">Lvl 347</div>
      </div>
    </div>

    <div class="logo">
      <div class="logo-main">LTF</div>
      <div class="logo-sub">LET'S THE FUTURE</div>
    </div>

    <div class="icons">
      <div class="icon-box">
        <span class="emoji">🎁</span>
        Bonus
      </div>

      <div class="icon-box">
        <span class="emoji">🔔</span>
        3
      </div>
    </div>

  </header>

  <section class="stats">

    <div class="stat">
      <div class="stat-title">🪙<br>LTF ASSETS</div>
      <div class="stat-value" id="balance">0</div>
      <div class="stat-sub" id="balanceUsd">≈ $0.00</div>
    </div>

    <div class="stat">
      <div class="stat-title">🔒<br>HOLDING</div>
      <div class="stat-value" id="holding">0.00</div>
      <div class="stat-sub">≈ $0.00</div>
    </div>

    <div class="stat">
      <div class="stat-title">💳<br>POOL WALLET</div>
      <div class="stat-value">834.40</div>
      <div class="stat-sub">≈ $834.40</div>
    </div>

  </section>

  <main class="mine">

    <div class="coin">
      <div class="coin-text">LTF gold coin</div>
    </div>

    <button class="claim-btn" id="claimBtn">
      ⚡ CLAIM LTF
    </button>

    <div class="countdown">
      ⏱ Next Claim in
      <span id="countdown">--:--:--</span>
    </div>

    <div class="loading" id="status"></div>

    <nav class="nav">
      <div><span>⛏️</span>Miners</div>
      <div><span>📋</span>Tasks</div>
      <div><span>👥</span>Friends</div>
      <div><span>👛</span>Wallet</div>
      <div><span>👤</span>Profile</div>
    </nav>

  </main>

</div>

<script>
  const SUPABASE_URL = "https://julnowgcrkazepbfxkau.supabase.co";
  const SUPABASE_KEY = "sb_publishable_4NQHH2wAc7MQPCxzcG8mHw_pJtX6r23";

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  let nextClaimAt = null;
  let countdownTimer = null;

  const balanceEl = document.getElementById("balance");
  const balanceUsdEl = document.getElementById("balanceUsd");
  const countdownEl = document.getElementById("countdown");
  const claimBtn = document.getElementById("claimBtn");
  const statusEl = document.getElementById("status");

  function getTelegramUser() {
    if (!tg.initDataUnsafe || !tg.initDataUnsafe.user) {
      return null;
    }

    return tg.initDataUnsafe.user;
  }

  function formatBalance(value) {
    const number = Number(value || 0);

    if (Number.isInteger(number)) {
      return number.toLocaleString("en-US");
    }

    return number.toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function updateBalance(value) {
    const number = Number(value || 0);

    balanceEl.textContent = formatBalance(number);
    balanceUsdEl.textContent =
      "≈ $" + number.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
  }

  function startCountdown() {
    if (countdownTimer) {
      clearInterval(countdownTimer);
    }

    function update() {
      if (!nextClaimAt) {
        countdownEl.textContent = "جاهز";
        claimBtn.disabled = false;
        return;
      }

      const target = new Date(nextClaimAt).getTime();
      const now = Date.now();
      const diff = target - now;

      if (diff <= 0) {
        countdownEl.textContent = "00:00:00";
        claimBtn.disabled = false;
        clearInterval(countdownTimer);
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);

      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      countdownEl.textContent =
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

      claimBtn.disabled = true;
    }

    update();
    countdownTimer = setInterval(update, 1000);
  }

  async function loadStatus() {
    const user = getTelegramUser();

    if (!user) {
      statusEl.textContent = "افتح التطبيق من داخل Telegram";
      claimBtn.disabled = true;
      return;
    }

    document.getElementById("avatar").textContent =
      (user.first_name || "L").charAt(0).toUpperCase();

    document.getElementById("username").textContent =
      user.username
        ? "@" + user.username
        : (user.first_name || "LTF Miner");

    statusEl.textContent = "جاري تحميل بياناتك...";

    const { data, error } = await supabase.rpc(
      "get_ltf_status",
      {
        p_telegram_user_id: Number(user.id)
      }
    );

    if (error) {
      console.error(error);
      statusEl.textContent = "خطأ: " + error.message;
      return;
    }

    const result = Array.isArray(data) ? data[0] : data;

    if (!result) {
      updateBalance(0);
      nextClaimAt = null;
      startCountdown();
      statusEl.textContent = "";
      return;
    }

    updateBalance(result.balance);

    nextClaimAt = result.next_claim_at || null;

    startCountdown();

    statusEl.textContent = "";
  }

  async function claimLTF() {

    const user = getTelegramUser();

    if (!user) {
      alert("افتح التطبيق من داخل Telegram");
      return;
    }

    claimBtn.disabled = true;
    statusEl.textContent = "جاري تنفيذ المطالبة...";

    const { data, error } = await supabase.rpc(
      "claim_ltf",
      {
        p_telegram_user_id: Number(user.id),
        p_username: user.username || null,
        p_first_name: user.first_name || null
      }
    );

    if (error) {
      console.error(error);

      alert("حدث خطأ: " + error.message);

      statusEl.textContent = "";
      await loadStatus();
      return;
    }

    const result = Array.isArray(data) ? data[0] : data;

    if (!result) {
      alert("لم تصل نتيجة من الخادم.");
      await loadStatus();
      return;
    }

    if (result.success) {

      updateBalance(result.new_balance);

      nextClaimAt = result.next_claim_at || null;

      startCountdown();

      tg.HapticFeedback.impactOccurred("medium");

      alert("تمت إضافة 1 LTF ✅");

    } else {

      nextClaimAt = result.next_claim_at || null;

      startCountdown();

      alert(
        result.message ||
        "المطالبة غير متاحة حالياً"
      );
    }

    statusEl.textContent = "";
  }

  claimBtn.addEventListener("click", claimLTF);

  loadStatus();
</script>

</body>
</html>
