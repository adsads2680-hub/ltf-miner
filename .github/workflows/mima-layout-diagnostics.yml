name: Read MIMA screen layout
on:
  push:
    branches: [mima-rank-friends-diagnose-20261012]
    paths: ['.github/workflows/mima-layout-diagnostics.yml']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install HTML parser
        run: python -m pip install -q html5lib
      - name: Extract layout declarations only
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          output=['FILE_LENGTH '+str(len(s))]
          selectors=('screen','mimaRank','rank','ref','friend','app','topbar','nav','page','scroll','viewport','position','height')
          styles=re.findall('<style.*?>(.*?)</style>',s,re.S|re.I)
          output.append('STYLE BLOCKS '+str(len(styles)))
          n=0
          for b,css in enumerate(styles):
            for m in re.finditer('([^{}]+)[{]([^{}]*)[}]',css):
              sel=m.group(1).strip()
              if any(term.lower() in sel.lower() for term in selectors):
                if len(sel)>220:continue
                body=m.group(2).strip()
                if len(body)>750:body=body[:750]+'...'
                output.append('STYLE['+str(b)+']: '+sel+' {'+body+'}')
                n+=1
          output.append('TOTAL MATCHING RULES '+str(n))
          for token in ['<section id="ref"','<section id="rank"','function go(id,el)','const screens','screens =','#rank','mimaRankWrap','mimaRankCrown','function renderRank','mimaRankHeader','window.scrollTo']:
            starts=[m.start() for m in re.finditer(re.escape(token),s)]
            output.append('TOKEN '+repr(token)+' COUNT '+str(len(starts)))
            for i in starts[:8]:
              output.append(f'AT {i}: '+s[max(0,i-180):i+1250].replace(chr(10),' '))
          try:
            import html5lib
            root=html5lib.parse(s,namespaceHTMLElements=False)
            parents={c:p for p in root.iter() for c in p}
            for tid in ['home','mine','tasks','ref','settings','rank','wallet']:
              el=next((e for e in root.iter() if e.attrib.get('id')==tid),None)
              if el is None:
                output.append('DOM TARGET NOT FOUND '+tid)
                continue
              chain=[]
              node=el
              while node is not None and len(chain)<12:
                chain.append(node.tag+'#'+str(node.attrib.get('id',''))+'.'+str(node.attrib.get('class','')))
                node=parents.get(node)
              output.append('DOM '+tid+' ANCESTORS '+ ' > '.join(chain))
              par=parents.get(el)
              if par is not None:
                siblings=list(par)
                output.append('DOM '+tid+' SIBLING INDEX '+str(siblings.index(el))+'/'+str(len(siblings)))
            app=next((e for e in root.iter() if e.attrib.get('class')=='app'),None)
            if app is not None:
              output.append('DOM APP DIRECT CHILDREN '+str([(x.tag,x.attrib.get('id'),x.attrib.get('class')) for x in list(app)][:35]))
          except Exception as exc:
            output.append('DOM INSPECTION ERROR '+str(exc))
          res=chr(10).join(output)
          Path('mima-layout-diagnostics.txt').write_text(res[:110000],encoding='utf-8')
          print('Diagnostic length',len(res),'saved',len(res[:110000]))
      - name: Save branch diagnostics
        run: |
          git config user.name "MIMA-Layout-Inspector"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mima-layout-diagnostics.txt
          git commit -m "Extract screen layout diagnostics for inspection"
          git push
