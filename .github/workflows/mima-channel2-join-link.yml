name: Update MIMA Channel2 Join Link
on:
  push:
    branches: [mima-join-channel2-post37-link-20261012]
    paths: ['.github/workflows/mima-channel2-join-link.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only the MIMACOIN2 join-task post URL
        shell: python
        run: |
          from pathlib import Path
          f=Path('index.html')
          text=f.read_text(encoding='utf-8')
          old="const url = 'https://t.me/MIMACOIN2/17';"
          new="const url = 'https://t.me/MIMACOIN2/37?single';"
          if text.count(old)!=1:raise SystemExit('Safety stop: expected exactly one old join-channel2 URL, found '+str(text.count(old)))
          if "const INTERACT_POST_URL = 'https://t.me/MIMACOIN2/37?single';" not in text:
            raise SystemExit('Safety stop: existing interact-post URL unexpectedly different')
          patched=text.replace(old,new)
          if patched.count(new)!=1 or len(patched)<1000000:
            raise SystemExit('Safety stop: unexpected content or link duplication')
          f.write_text(patched,encoding='utf-8')
          print('Updated only join-channel2 URL; interact task and rewards unchanged.')
      - name: Commit link update
        run: |
          git config user.name "MIMA Channel Link Update"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Update MIMACOIN2 join task link to post 37"
          git push
