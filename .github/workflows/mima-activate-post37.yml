name: Activate verified MIMA post task
on:
  push:
    branches: [mima-post37-verified-visible-20261012]
    paths: ['.github/workflows/mima-activate-post37.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely enable post task UI and server opening
        shell: python
        run: |
          from pathlib import Path
          f=Path('index.html')
          src=f.read_text(encoding='utf-8')
          def once(before,after,expected=1):
            global src
            n=src.count(before)
            if n!=expected:raise SystemExit(f'Safety stop: expected {expected}, got {n}: {before[:90]}')
            src=src.replace(before,after)
          once('id="interactPostTaskItem" style="display:none" aria-hidden="true"',
               'id="interactPostTaskItem"')
          once("""  function openInteractPost(){
              try{ localStorage.setItem(INTERACT_POST_OPENED_KEY,'1'); }catch(e){}
              renderInteractPostTask();""",
          """  async function openInteractPost(){
            if(serverMode){
              try{
                const result=await apiCall('open_channel_task',{task_code:'interact_mimacoin2_post'});
                if(result?.success!==true) throw new Error('Post open registration failed');
              }catch(e){
                toast(tx('تعذّر تسجيل فتح المنشور، حاول مرة أخرى','Could not register post opening. Please try again.'));
                return;
              }
            }
            try{ localStorage.setItem(INTERACT_POST_OPENED_KEY,String(Date.now())); }catch(e){}
            renderInteractPostTask();
            setTimeout(renderInteractPostTask,10100);""")
          once("try{ opened = localStorage.getItem(INTERACT_POST_OPENED_KEY) === '1'; }catch(e){}",
               "try{ opened = Number(localStorage.getItem(INTERACT_POST_OPENED_KEY)) > 1000000000000; }catch(e){}",2)
          once("""    if(!opened){
                btn.disabled = true;
                btn.textContent = tx('افتح المنشور أولاً','Open post first');""",
          """    let openedAt = 0;
            try{ openedAt = Number(localStorage.getItem(INTERACT_POST_OPENED_KEY)||0); }catch(e){}
            if(openedAt>1000000000000 && Date.now()-openedAt<10000){
              btn.disabled = true;
              btn.textContent = tx('تحقق','Verify');
              info.textContent = tx('+5 MIMA • جار التحقق من فتح المنشور','+5 MIMA • verifying post opening');
              return;
            }
            if(!opened){
              btn.disabled = true;
              btn.textContent = tx('افتح المنشور أولاً','Open post first');""")
          if "const INTERACT_POST_URL = 'https://t.me/MIMACOIN2/37?single';" not in src:
            raise SystemExit('Safety stop: new post URL is missing')
          if src.count("task_code:'interact_mimacoin2_post'")!=2:
            raise SystemExit('Safety stop: expected open and claim references only')
          if src.count('id="interactPostTaskItem"')!=1:
            raise SystemExit('Safety stop: task row markup unexpected')
          if len(src)<1000000:raise SystemExit('Safety stop: source file unexpectedly small')
          f.write_text(src,encoding='utf-8')
          print('PASS: post task visible; server-open registered before link; 10s gate; claim unchanged.')
      - name: Commit updated index
        run: |
          git config user.name "MIMA-Task-Repair"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Show verified post interaction task with server-side opening"
          git push
