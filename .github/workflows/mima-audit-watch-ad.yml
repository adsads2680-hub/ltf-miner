name: Inspect advertisement event wiring
on:
  push:
    branches: [inspect-mima-watch-ad-20261012]
    paths: ['.github/workflows/mima-audit-watch-ad.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract scoped ad triggers and placements
        shell: python
        run: |
          from pathlib import Path
          import re
          src=Path('index.html').read_text(encoding='utf-8')
          lines=src.splitlines()
          pat=re.compile(r'adsgram|showAd|watchAd|claimAd|AdController|adTask|rewardedAd|interstitial|mimaRewarded|mimaAd|MIMA Rewarded Ads|Mining Start', re.I)
          matches=[i for i,line in enumerate(lines) if pat.search(line)]
          out=['Total lines: '+str(len(lines)), 'Matching lines: '+str(len(matches))]
          for i in matches:
            out.append('LINE '+str(i+1)+' '+lines[i][:350])
          markerpat=re.compile(r'function .*ad|async function .*ad|\bwatchAd\b|\bclaimAd\b|adsgram\.show|adController|AdController',re.I)
          starters=[i for i,line in enumerate(lines) if markerpat.search(line)]
          out.append('---- SCOPED CONTEXT ----')
          for i in starters[:45]:
            out.append('---- line '+str(i+1)+' ----')
            out.extend(str(j+1)+': '+lines[j][:300] for j in range(max(0,i-7),min(len(lines),i+65)))
          Path('mima-ad-wiring-report.txt').write_text('\n'.join(out)[:160000],encoding='utf-8')
      - name: Save report on temporary branch
        run: |
          git config user.name "MIMA Code Audit"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mima-ad-wiring-report.txt
          git commit -m "Temporary advertisement wiring inspection"
          git push
